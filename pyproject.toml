[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fdem"
version = "0.1.0"
description = "Estimate rotated surface-code logical error rates from Stim detector error models"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.9,<4",
    "numpy>=1.26",
    "pymatching>=2.3,<3",
    "scipy>=1.17,<2",
    "stim>=1.15,<2",
    "tqdm>=4.67,<5",
]

[project.scripts]
fdem = "fdem.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
