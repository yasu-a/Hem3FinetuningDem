<script>
"use strict";
const data=JSON.parse(document.getElementById("dataset").textContent);
const el=id=>document.getElementById(id);
const canvas=el("heatmap");
const anchors=[[0,0,77],[0,0,255],[255,255,255],[255,0,0],[128,0,0]];
let experiment, current;
const scale=()=>el("common-scale").checked?Math.max(...Object.values(data).map(d=>d.limit)):experiment.limit;
function color(value,limit){
  if(value===null)return [255,255,255,255];
  const t=2*(Math.max(-1,Math.min(1,value/limit))+1), k=Math.min(3,Math.floor(t));
  return [...anchors[k].map((v,j)=>Math.round(v+(anchors[k+1][j]-v)*(t-k))),255];
}
function draw(){
  const {order,rounds,matrix}=current, n=order.length, limit=scale();
  const raster=document.createElement("canvas");
  raster.width=raster.height=n;
  const layer=raster.getContext("2d"), bitmap=layer.createImageData(n,n);
  order.forEach((i,row)=>order.forEach((j,col)=>{
    bitmap.data.set(color(i===null||j===null?null:matrix[i][j],limit),4*((n-1-row)*n+col));
  }));
  layer.putImageData(bitmap,0,0);
  canvas.width=canvas.height=Math.max(640,Math.round(canvas.clientWidth*devicePixelRatio));
  const ctx=canvas.getContext("2d"), size=canvas.width;
  ctx.imageSmoothingEnabled=false;
  ctx.drawImage(raster,0,0,size,size);
  ctx.strokeStyle="#808080";ctx.lineWidth=1.4*size/canvas.clientWidth;
  ctx.beginPath();
  for(let i=rounds;i<n;i+=rounds){
    const x=i*size/n;
    ctx.moveTo(x,0);ctx.lineTo(x,size);ctx.moveTo(0,x);ctx.lineTo(size,x);
  }
  ctx.stroke();
}
function detectorText(id){
  const d=current.detectors[id];
  return `D${id} · ${d.label ?? `q${d.qubit}`} at (${d.x}, ${d.y}) · time ${d.time} · ${d.kind}`;
}
function formatValue(value){
  return Number(value.toPrecision(6)).toString();
}
function showPair(){
  const i=el("i").valueAsNumber, j=el("j").valueAsNumber;
  if(!current||!Number.isInteger(i)||!Number.isInteger(j)||!current.detectors[i]||!current.detectors[j]){
    el("value").textContent="Enter two valid detector IDs";
    el("description").textContent="";
    return;
  }
  const value=current.matrix[i][j];
  el("value").textContent=value===null?"Undefined":formatValue(value);
  el("description").textContent=detectorText(i)+"\n"+detectorText(j);
}
function point(event){
  const rect=canvas.getBoundingClientRect(), n=current.order.length;
  const row=n-1-Math.floor((event.clientY-rect.top)*n/rect.height);
  const col=Math.floor((event.clientX-rect.left)*n/rect.width);
  if(row<0||row>=n||col<0||col>=n)return;
  const i=current.order[row],j=current.order[col];
  if(i===null||j===null){
    el("value").textContent="No detector in this slot";
    el("description").textContent="Some checks have no detector at time zero.";
    return;
  }
  el("i").value=i;el("j").value=j;
  showPair();
}
function textSpan(value){
  const span=document.createElement("span");span.textContent=value;return span;
}
function load(){
  current=experiment.runs["8"];
  const labels=current.check_labels;
  el("xlabels").style.gridTemplateColumns=`repeat(${labels.length},minmax(0,1fr))`;
  el("ylabels").style.gridTemplateRows=`repeat(${labels.length},minmax(0,1fr))`;
  el("xlabels").replaceChildren(...labels.map(textSpan));
  el("ylabels").replaceChildren(...[...labels].reverse().map(textSpan));
  el("stats").textContent=`${current.shots.toLocaleString()} shots · ${current.detectors.length} detectors`;
  for(const id of ["i","j"])el(id).max=current.detectors.length-1;
  el("i").value=0;el("j").value=1;
  el("assets").replaceChildren(...Object.entries(experiment.files).map(([label,file])=>{
    const link=document.createElement("a");link.href=`${experiment.directory}/r${current.rounds}/${file}`;
    link.textContent=label;link.download=file;
    return link;
  }));
  updateScale();showPair();
}
function updateScale(){
  const limit=scale();
  el("legend-labels").replaceChildren(...[limit,0,-limit].map(v=>textSpan(v.toFixed(3))));
  const messages=current.selection_note?[current.selection_note]:[];
  if(current.clipped)messages.push(`${current.clipped} plotted pairs exceed the color scale. The inspector and CSV show the original estimates.`);
  if(current.undefined)messages.push(`The full matrix has ${current.undefined} undefined detector pairs.`);
  if(el("common-scale").checked)messages.push("The PNG download uses the dataset’s own scale.");
  el("plot-note").textContent=messages.join(" ");
  draw();
}
el("common-scale").addEventListener("change",updateScale);
function chooseExperiment(){
  experiment=data[el("experiment").value];
  el("experiment-summary").textContent=experiment.summary;
  el("dataset-source").href=experiment.source;
  el("dataset-source").textContent=experiment.source_label;
  el("layout-image").src=experiment.layout;
  for(const id of ["layout-image-link","layout-full"])el(id).href=experiment.layout;
  el("layout-caption").textContent=experiment.layout_caption;
  el("provenance").href=`${experiment.directory}/provenance.json`;
  load();
}
el("experiment").addEventListener("change",chooseExperiment);
for(const id of ["i","j"])el(id).addEventListener("input",showPair);
canvas.addEventListener("pointermove",point);
canvas.addEventListener("pointerdown",point);
window.addEventListener("resize",draw);
chooseExperiment();
</script>
